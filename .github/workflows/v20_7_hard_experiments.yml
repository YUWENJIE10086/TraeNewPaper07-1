name: v20-7 hard experiments

on:
  push:
    paths:
      - 'Papers2/v20/code/run_v20_7_hard_experiments_0916_0811.py'
      - '.github/workflows/v20_7_hard_experiments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn lightgbm matplotlib
      - name: Run four hard experiments
        run: python Papers2/v20/code/run_v20_7_hard_experiments_0916_0811.py
      - name: Commit experiment outputs
        run: |
          git config user.name "chatgpt-experiment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Papers2/v20/experiments/0916_0811
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add v20-7 hard experiment results [skip ci]"
            git push
          fi
