name: v20 final corrected P35 validation
on:
  push:
    paths:
      - 'Papers2/v20/code/run_v20_final_rlearner_pipeline_0916_0827.py'
      - '.github/workflows/v20_final_pipeline_0827.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy scikit-learn lightgbm matplotlib
      - run: python Papers2/v20/code/run_v20_final_rlearner_pipeline_0916_0827.py
      - name: Commit results
        run: |
          git config user.name "chatgpt-experiment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Papers2/v20/experiments/0916_0827
          git commit -m "Add corrected P35 v20 validation results [skip ci]" || exit 0
          git push
