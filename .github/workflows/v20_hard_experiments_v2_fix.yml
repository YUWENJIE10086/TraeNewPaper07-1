name: v20 hard experiments v2 fixed

on:
  push:
    paths:
      - 'Papers2/v20/code/run_4_hard_experiments_v2_fix_0916_0014.py'
      - '.github/workflows/v20_hard_experiments_v2_fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn matplotlib 'econml>=0.16,<0.17'
      - name: Run strict hard experiments v2 fixed
        run: python Papers2/v20/code/run_4_hard_experiments_v2_fix_0916_0014.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Papers2/v20/experiments/0916_0014
          if git diff --cached --quiet; then
            echo 'No new outputs'
          else
            git commit -m 'v20: add strict hard experiment results 0916_0014'
            git push
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v20-hard-experiments-v2-fixed-0916-0014
          path: Papers2/v20/experiments/0916_0014
